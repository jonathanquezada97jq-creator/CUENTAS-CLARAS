# Corre las pruebas de cálculo cada vez que se sube un cambio a GitHub.
# Si una prueba falla, GitHub lo marca con una X roja en el commit.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
