<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cuentas Claras</title>
    <meta
      name="description"
      content="Finanzas del hogar para El Salvador: salarios con ISSS, AFP y renta, tarjetas, cuotas y pagos del mes."
    />
    <meta name="theme-color" content="#1446b8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cuentas" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icono-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />

    <!-- Estilos: variables → base → componentes → piezas de cada pestaña -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/componentes.css" />
    <link rel="stylesheet" href="css/vistas.css" />

    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="encabezado">
        <div class="encabezado__marca">Cuentas Claras <small>SV</small></div>
        <div class="encabezado__guardado" id="indicador-guardado" role="status" hidden></div>
        <button
          type="button"
          class="boton-icono"
          id="boton-ajustes"
          data-accion="abrir-ajustes"
          aria-label="Ajustes y respaldo"
          hidden
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h9M18 6h2M4 12h3M11 12h9M4 18h11M19 18h1" />
            <circle cx="15.5" cy="6" r="2.2" /><circle cx="8.5" cy="12" r="2.2" /><circle cx="17" cy="18" r="2.2" />
          </svg>
        </button>
      </header>

      <!-- Aquí js/app.js dibuja la pestaña activa -->
      <main id="vista" class="vista">
        <section class="pantalla" id="pantalla-inicial">
          <span class="etiqueta">Un momento</span>
          <h1>Cargando…</h1>
        </section>
      </main>
    </div>

    <nav class="pestanas" id="pestanas" aria-label="Secciones" hidden>
      <div class="pestanas__contenido">
        <a class="pestanas__boton" href="#inicio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5V19a1 1 0 0 1-1 1H15v-5.5H9V20H4.5a1 1 0 0 1-1-1z" /></svg>
          Inicio
        </a>
        <a class="pestanas__boton" href="#pagos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2" /><path d="M3.5 10h17M8 3v4M16 3v4M8 14l2 2 4-4" /></svg>
          Pagos
        </a>
        <a class="pestanas__boton" href="#tarjetas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.2" /><path d="M2.5 9.5h19M6 15h4" /></svg>
          Tarjetas
        </a>
        <a class="pestanas__boton" href="#cuotas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 20.5 8 12 12.5 3.5 8z" /><path d="M3.5 12 12 16.5 20.5 12M3.5 16 12 20.5 20.5 16" /></svg>
          Cuotas
        </a>
        <a class="pestanas__boton" href="#ingresos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5h15a1.5 1.5 0 0 1 1.5 1.5v9.5A1.5 1.5 0 0 1 19 20H4z" /><path d="M4 7.5V5.5A1.5 1.5 0 0 1 5.5 4H16" /><circle cx="16" cy="13.8" r="1.4" /></svg>
          Ingresos
        </a>
      </div>
    </nav>

    <!-- Hoja inferior para formularios (js/ui/hoja.js) -->
    <div class="hoja" id="hoja" hidden>
      <div class="hoja__panel" id="hoja-panel" role="dialog" aria-modal="true" tabindex="-1"></div>
    </div>

    <!-- Aviso flotante (js/ui/aviso.js) -->
    <div class="aviso-flotante" id="aviso" role="status" hidden></div>

    <noscript>Esta app necesita JavaScript activado.</noscript>

    <!-- Si la app no arranca en 10 segundos (sin internet la primera vez,
         o un error al cargar), se explica en lugar de quedarse en blanco. -->
    <script>
      setTimeout(function () {
        if (document.documentElement.dataset.iniciada) return;
        var pantalla = document.getElementById('pantalla-inicial');
        if (!pantalla) return;
        pantalla.innerHTML =
          '<span class="etiqueta">No cargó</span><h1>Revisá tu conexión</h1>' +
          '<p>La app necesita internet la primera vez que se abre. Conectate y recargá la página.</p>';
      }, 10000);
    </script>
  </body>
</html>
